<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#33413a" />
    <script>
      // thème appliqué avant l'affichage (pas de flash) + classe « js » pour les animations
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        var t = 'system'
        try {
          t = localStorage.getItem('phasmo-coach/theme') || 'system'
        } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        d.setAttribute('data-theme', dark ? 'dark' : 'light')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a0c0b' : '#33413a')
      })()
    </script>
    <meta name="description" content="Entraînement hors-jeu pour Phasmophobia : codex des entités, révision espacée, quiz et mises en situation." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Phasmo Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
